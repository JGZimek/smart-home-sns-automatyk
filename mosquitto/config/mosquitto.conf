persistence true
persistence_location /mosquitto/data/

# WAŻNA ZMIANA: Wysyłaj logi na stdout, aby Docker logrotate mógł nimi zarządzać
log_dest stdout

# Nasłuchuj na porcie 1883 (dla ESP32)
listener 1883

# Nasłuchuj na porcie 9001 (Websockets - dla frontendów JS w Node-RED)
listener 9001
protocol websockets

# ZABRANIAJ dostępu bez hasła
allow_anonymous false
password_file /mosquitto/config/passwd
