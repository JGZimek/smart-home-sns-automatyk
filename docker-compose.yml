services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    # Ograniczenie logow – chroni karte SD Pi Zero 2W przed zapchaniem.
    # (Watchdog brokera realizuje host-owy smarthome-health.timer -> health-check.sh.)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
