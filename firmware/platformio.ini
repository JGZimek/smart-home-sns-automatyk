[platformio]
default_envs = basic_default

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags = 
    -D CORE_DEBUG_LEVEL=3
monitor_filters = direct, esp32_exception_decoder
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.basic_default" 

; ==========================================================
; ŚRODOWISKA
; ==========================================================
[env:basic_default]
build_flags = ${env.build_flags} -D MODULE_DEFAULT

[env:access_system]
build_flags = ${env.build_flags} -D MODULE_ACCESS

[env:environment_system]
build_flags = ${env.build_flags} -D MODULE_ENV

[env:security_system]
build_flags = ${env.build_flags} -D MODULE_SECURITY